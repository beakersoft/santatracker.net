<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SleighWatch widget v1</title>
  <link rel="stylesheet" href="/assets/widget/v1/widget.css">
</head>
<body>
  <main class="widget" data-state="loading" aria-live="polite">
    <section class="widget-card" aria-label="SleighWatch Santa status">
      <img class="widget-icon" src="/assets/img/brand/sleighwatch-icon.png" alt="">
      <div>
        <p class="widget-eyebrow"><a href="https://sleighwatch.com" target="_blank" rel="noopener noreferrer">SleighWatch</a></p>
        <p id="widget-description" class="widget-description">Finding Santa…</p>
        <p id="widget-status" class="widget-status">Checking the latest location.</p>
      </div>
    </section>
  </main>
  <script src="/assets/widget/v1/widget.js"></script>
</body>
</html>
